<mat-card>
  <mat-card-title class="project-title" style="display: flex; align-items: center; justify-content: space-between;">
    <span style="padding-left: 20px">Entidades del Proyecto</span>
    <span style="display: flex; gap: 8px;">

      <button *ngIf="!viewMode" mat-raised-button class="bg-light-primary" (click)="goToCreateEntity()">Nueva Entidad</button>
      <button mat-raised-button class="bg-light-success" (click)="viewDiagram()">Ver diagrama</button>
      <button mat-raised-button class="bg-light-error" (click)="goBack()">Regresar</button>
    </span>
  </mat-card-title>
  <mat-card-content>
    <table mat-table [dataSource]="entities" class="mat-elevation-z8" style="width: 100%; margin-top: 16px;">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let entity">{{ entity.name }}</td>
      </ng-container>
      <ng-container matColumnDef="tableName">
        <th mat-header-cell *matHeaderCellDef>Tabla</th>
        <td mat-cell *matCellDef="let entity">{{ entity.tableName }}</td>
      </ng-container>
      <ng-container matColumnDef="apiName">
        <th mat-header-cell *matHeaderCellDef>Nombre de la api</th>
        <td mat-cell *matCellDef="let entity">{{ entity.apiName }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let entity">
          @if (!viewMode) {
            <button mat-icon-button (click)="editEntity(entity)">
              <mat-icon color="primary">edit</mat-icon>
            </button>
            <button mat-icon-button (click)="deleteEntity(entity)">
              <mat-icon color="secondary">delete</mat-icon>
            </button>
          }
          @else{
            <button mat-icon-button (click)="viewEntity(entity)">
              <mat-icon color="primary">visibility</mat-icon>
            </button>
          }

        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="['name', 'tableName','apiName', 'actions']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['name', 'tableName', 'apiName','actions'];"></tr>
    </table>
  </mat-card-content>

</mat-card>
