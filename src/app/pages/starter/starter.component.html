<mat-card>
  <mat-card-title class="project-title" style="display: flex; align-items: center; justify-content: space-between;">
    <span style="padding-left: 20px">Proyectos publicos</span>
  </mat-card-title>
  <mat-card-content>
    <div class="layout-data">
      <div class="mat-elevation-z8">
        <table mat-table [dataSource]="dataSource" matSort>
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header style="width: 15%;">Nombre</th>
            <td mat-cell *matCellDef="let row">
              <a>{{row.name}}</a>
            </td>
          </ng-container>

          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef mat-sort-header style="width: 10%;">Estado</th>
            <td mat-cell *matCellDef="let row">
              <mat-chip-set>
                <mat-chip [ngClass]="{
                    'bg-light-primary': row.status === 'NEW',
                    'bg-light-secondary': row.status === 'CREATED',
                    'bg-light-success': row.status === 'CLONED',
                    'bg-light-warning': row.status === 'GENERATED',
                    'bg-light-error': row.status === 'ERROR'
                  }">
                  {{ row.status }}
                </mat-chip>
              </mat-chip-set>
            </td>
          </ng-container>

          <ng-container matColumnDef="basePath">
            <th mat-header-cell *matHeaderCellDef mat-sort-header style="width: 10%;">Ruta</th>
            <td mat-cell *matCellDef="let row">{{row.basePath}}</td>
          </ng-container>

          <ng-container matColumnDef="port">
            <th mat-header-cell *matHeaderCellDef mat-sort-header style="width: 7%;">Puerto</th>
            <td mat-cell *matCellDef="let row">{{row.port}}</td>
          </ng-container>

          <ng-container matColumnDef="isPrivate">
            <th mat-header-cell *matHeaderCellDef mat-sort-header style="width: 7%;">Privado</th>
            <td mat-cell *matCellDef="let row">{{row.isPrivate ? 'Sí' : 'No'}}</td>
          </ng-container>

          <ng-container matColumnDef="updateDate">
            <th mat-header-cell *matHeaderCellDef mat-sort-header style="width: 10%;">Ultima actualización</th>
            <td mat-cell *matCellDef="let row">{{row.updateDate | date: 'dd/MM/yyyy HH:mm:ss'}}</td>
          </ng-container>

            <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef style="width: 11%;">Acciones</th>
            <td mat-cell *matCellDef="let row">
              <button mat-icon-button (click)="viewProject(row)" color="primary">
                <mat-icon color="primary">visibility</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
        <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 25, 100]"></mat-paginator>
      </div>
    </div>
  </mat-card-content>
</mat-card>
