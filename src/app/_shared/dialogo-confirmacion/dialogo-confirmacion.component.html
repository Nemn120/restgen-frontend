<h1 mat-dialog-title style="text-align: center;">{{mensaje.title}}</h1>
<div mat-dialog-content>
    <p>{{mensaje.description}}</p>
</div>
<div mat-dialog-actions class="buttons">
  <button mat-raised-button class="bg-light-primary" (click)="confirmado()" type="button">Sí</button>
  <button mat-raised-button class="bg-light-error" (click)="cerrarDialogo()" type="button">Cancelar</button>
</div>
