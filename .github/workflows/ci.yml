name: CI
on:
  push:
    branches:
      - develop
jobs:
  ci:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install dependencies
        run: npm ci
      - name: Build Angular App
        run: npm run-script build-prod
